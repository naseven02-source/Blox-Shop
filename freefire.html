<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ເຕີມ Free Fire - Blox Shop</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .pack { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px; margin-bottom: 8px;
      border-radius: 12px; font-size: 15px; font-weight: bold; color: #fff; cursor: pointer; text-align: left;
      background: rgba(255,255,255,.08); border: 1px solid rgba(160,210,255,.25); font-family: inherit; }
    .tabs { display: flex; gap: 8px; margin: 6px 0 12px; }
    .tabs button { flex: 1; padding: 10px 4px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit;
      color: #fff; background: transparent; border: 1px solid rgba(160,210,255,.4); }
    .tabs button.on { background: var(--accent); border-color: var(--accent); }
    .pack.on { border-color: var(--accent); background: rgba(239,68,68,.25); }
    .pack > div { flex: 1; min-width: 0; }
    .pack span { color: #fbbf24; white-space: nowrap; flex-shrink: 0; margin-left: 12px; }
    /* ===== ໜ້າຕ່າງຊຳລະເງິນ QR ===== */
    .pay-modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.65); padding: 16px; }
    .pay-modal.on { display: flex; }
    .pay-box { position: relative; width: 100%; max-width: 380px; max-height: 92vh; overflow-y: auto; background: #0f1d3a; color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 22px; padding: 18px; text-align: center; }
    .pay-box h4 { margin: 4px 0 14px; font-size: 22px; }
    .pay-x { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.15); color: #fff; font-size: 20px; cursor: pointer; }
    .pay-name { background: rgba(255,255,255,.1); border-radius: 12px; padding: 12px; font-size: 17px; margin-bottom: 12px; }
    .pay-total b { color: #22c55e; font-size: 24px; }
    .pay-scan { margin: 10px 0; }
    .pay-qr { width: 100%; border-radius: 18px; display: block; background: #fff; }
    .pay-done { width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 6px 18px rgba(239,68,68,.45); transition: transform .12s, filter .12s; }
    .pay-done:hover { filter: brightness(1.08); }
    .pay-done:active { transform: scale(.98); }
    .pay-note { margin: 10px 0 0; font-size: 13px; opacity: .75; }
  </style>
</head>
<body>
  <div id="snow"></div>

  <div class="top">
    <div class="brand"><span id="bMain">BLOX</span> <b id="bAcc">SHOP</b></div>
    <a class="back" href="index.html">← ກັບໜ້າຫຼັກ</a>
  </div>

  <a class="fab" id="fab" href="#" target="_blank" aria-label="ແຊັດກັບຮ້ານ">
    <svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.7 1.4 5.1 3.6 6.7V22l3.3-1.8c.9.2 1.9.4 3.1.4 5.5 0 10-3.9 10-8.7S17.5 3 12 3z"/></svg>
  </a>

  <div class="wrap">
    <h3 class="sec" id="title" style="margin-top:6px"></h3>

    <div class="cat">
      <label>ເລືອກແພັກເກັດ</label>
      <div class="tabs"><button id="tabD" class="on">💎 ເພັດ</button><button id="tabW">📅 ລາຍອາທິດ / ລາຍເດືອນ</button></div>
      <div id="packs" style="margin-top:6px"></div>
      <div id="packsW" style="margin-top:6px;display:none"></div>
    </div>

  </div>

  <!-- ໜ້າຕ່າງຊຳລະເງິນ QR -->
  <div class="pay-modal" id="payModal">
    <div class="pay-box">
      <button class="pay-x" onclick="closePay()" aria-label="ປິດ">✕</button>
      <h4>ຊຳລະເງິນ</h4>
      <div class="pay-name" id="payName"></div>
      <div class="pay-total">ຍອດໂອນທັງໝົດ: <b id="payPrice"></b></div>
      <div class="pay-scan">ສະແກນເພື່ອໂອນ</div>
      <img class="pay-qr" id="qr" alt="QR ຊຳລະເງິນ" />
      <button class="pay-done" onclick="sendOrder()">ໂອນແລ້ວ -> ແຄັບສະລິບທັກແຊັດຮັບຂອງ</button>
      <p class="pay-note">ໂອນແລ້ວ ທັກແຊັດ ບອກ ID ພ້ອມສົ່ງສະລິບ<br>* ກວດສອບຍອດເງິນໃຫ້ຖືກຕ້ອງກ່ອນໂອນ</p>
    </div>
  </div>

  <!-- ໜ້ານີ້ບໍ່ໃຊ້ Supabase -->
  <script src="config.js"></script>
  <script src="site.js"></script>
  <script>
    // ===== ແກ້ລາຄາບ່ອນນີ້ =====
    const GAME = {
      name: "Free Fire",
      idLabel: "ID Free Fire",
      packs: [
        { name: "33 💎",   price: 8000 },
        { name: "68 💎",   price: 15000 },
        { name: "172 💎",  price: 35000 },
        { name: "310 💎",  price: 60500 },
        { name: "517 💎",  price: 99000 },
        { name: "690 💎",  price: 133333 },
        { name: "1052 💎", price: 198888 },
        { name: "1801 💎", price: 328888 },
        { name: "3698 💎", price: 648888 },
        { group: "pass", name: "ລາຍອາທິດມິນິ", note: "200 💎 ໄດ້ຮັບທັນທີ · 60 💎 ຮັບ 20 💎 ທຸກມື້", price: 25000 },
        { group: "pass", name: "ລາຍອາທິດ", note: "450 💎 ໄດ້ຮັບທັນທີ · 100 💎 ຮັບ 50 💎 ທຸກມື້", price: 46444 },
        { group: "pass", name: "ລາຍເດືອນ", note: "2600 💎 ໄດ້ຮັບທັນທີ · 500 💎 ຮັບ 70 💎 ທຸກມື້", price: 199999 }
      ]
    };

    const $ = function (id) { return document.getElementById(id); };
    let pick = null;

    function sendOrder() {
      const m = "ສະບາຍດີ ຢາກເຕີມເກມ:\n• ເກມ: " + GAME.name + "\n• ແພັກເກັດ: " + pick.name + (pick.note ? " (" + pick.note + ")" : "") +
        "\n• ລາຄາ: " + fmt(pick.price) + "\n• ໂອນເງິນແລ້ວ ຈະສົ່ງ ID ແລະສະລິບໃຫ້";
      window.open(chatLink(m), "_blank");
      closePay();
    }
    function closePay() { $("payModal").classList.remove("on"); }

    (function () {
      setupCommon();
      $("title").textContent = "ເຕີມ " + GAME.name;
      $("qr").src = SITE.qrImg || "1795345334511.jpg"; // ຮູບ QR ຮັບເງິນ (ວາງໄຟລ໌ໄວ້ໃນໂຟນເດີດຽວກັນ)
      function tab(w) {
        $("packs").style.display = w ? "none" : "block";
        $("packsW").style.display = w ? "block" : "none";
        $("tabD").classList.toggle("on", !w);
        $("tabW").classList.toggle("on", w);
      }
      $("tabD").onclick = function () { tab(false); };
      $("tabW").onclick = function () { tab(true); };
      GAME.packs.forEach(function (p) {
        const b = document.createElement("button");
        b.className = "pack";
        b.innerHTML = "<div>" + esc(p.name) + (p.note ? '<small style="display:block;font-weight:normal;font-size:12px;color:#bcd9f5;margin-top:2px">' + esc(p.note) + "</small>" : "") + "</div><span>" + fmt(p.price) + "</span>";
        b.onclick = function () {
          pick = p;
          document.querySelectorAll(".pack").forEach(function (x) { x.classList.remove("on"); });
          b.classList.add("on");
          $("payName").textContent = GAME.name + " - " + p.name;
          $("payPrice").textContent = fmt(p.price);
          $("payModal").classList.add("on");
        };
        $(p.group === "pass" ? "packsW" : "packs").appendChild(b);
      });
    })();
  </script>
</body>
</html>

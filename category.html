<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ສິນຄ້າ - Blox Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="snow"></div>

  <div class="top">
    <div class="brand"><span id="bMain">BLOX</span> <b id="bAcc">SHOP</b></div>
    <a class="back" href="index.html">← ກັບໜ້າຫຼັກ</a>
  </div>

  <a class="fab" id="fab" href="#" target="_blank" aria-label="ແຊັດກັບຮ້ານ">
    <svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.7 1.4 5.1 3.6 6.7V22l3.3-1.8c.9.2 1.9.4 3.1.4 5.5 0 10-3.9 10-8.7S17.5 3 12 3z"/></svg>
  </a>

  <div class="wrap">
    <h3 class="sec" id="title" style="margin-top:6px"></h3>
    <p class="sec-sub" id="sub"></p>
    <div class="msg" id="msg">ກຳລັງໂຫຼດ...</div>
    <div id="list"></div>
  </div>

  <!-- ປ່ອງສັ່ງຊື້ -->
  <div class="modal" id="modal">
    <div class="box">
      <h4 id="mName"></h4>
      <div class="price" id="mPrice"></div>
      <div id="mTopup">
        <label>ID / ຊື່ຜູ້ຫຼິ້ນໃນເກມ</label>
        <input id="mPlayer" placeholder="ໃສ່ ID ເກມທີ່ຕ້ອງການເຕີມ" />
      </div>
      <div class="row">
        <button class="btn ghost" onclick="closeM()">ຍົກເລີກ</button>
        <button class="btn" onclick="sendOrder()">ສັ່ງຊື້ທາງແຊັດ</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="site.js"></script>
  <script>
    const $ = function (id) { return document.getElementById(id); };
    let cur = null, catName = "";

    function openM(p) {
      cur = p;
      $("mName").textContent = p.name;
      $("mPrice").textContent = fmt(p.price);
      $("mTopup").style.display = p.type === "topup" ? "block" : "none";
      $("mPlayer").value = "";
      $("modal").classList.add("on");
    }
    function closeM() { $("modal").classList.remove("on"); }
    function sendOrder() {
      if (!cur) return;
      let m = "ສະບາຍດີ ຢາກສັ່ງຊື້:\n• " + catName + " - " + cur.name + "\n• ລາຄາ: " + fmt(cur.price);
      if (cur.type === "topup") {
        const id = $("mPlayer").value.trim();
        if (!id) { alert("ກະລຸນາໃສ່ ID ຜູ້ຫຼິ້ນ"); return; }
        m += "\n• ID ເກມ: " + id;
      }
      window.open(chatLink(m), "_blank");
      closeM();
    }

    async function boot() {
      setupCommon();
      const msg = $("msg");
      if (!db) { msg.textContent = "ຍັງບໍ່ໄດ້ຕັ້ງຄ່າ config.js"; return; }
      const id = new URLSearchParams(location.search).get("c");
      if (!id) { msg.textContent = "ບໍ່ພົບໝວດສິນຄ້າ"; return; }
      try {
        const c = await db.from("categories").select("*").eq("id", id).maybeSingle();
        const p = await db.from("products").select("*").eq("category_id", id).order("created_at");
        if (c.error || p.error || !c.data) { msg.textContent = "ໂຫຼດຂໍ້ມູນບໍ່ໄດ້"; return; }
        catName = c.data.name;
        $("title").textContent = c.data.name;
        $("sub").textContent = c.data.descr || "";
        document.title = c.data.name + " - Blox Shop";

        const items = p.data.filter(function (q) { return !q.hidden; });
        if (!items.length) { msg.textContent = "ຍັງບໍ່ມີສິນຄ້າໃນໝວດນີ້"; return; }
        msg.style.display = "none";

        items.forEach(function (q) {
          const out = !(q.stock > 0);
          const d = document.createElement("div");
          d.className = "cat";
          d.innerHTML =
            (q.img ? '<div class="ban"><img src="' + esc(q.img) + '" alt="' + esc(q.name) + '" /></div>' : "") +
            '<div class="ctitle">' + esc(q.name) +
              '<span class="tag">' + (q.type === "topup" ? "ເຕີມເກມ" : "ໄອດີ") + "</span></div>" +
            '<div class="ccount">' + esc(q.descr) + "</div>" +
            '<div class="price">' + fmt(q.price) + "</div>" +
            '<div class="ccount">ເຫຼືອ ' + (q.stock || 0) + " · ຂາຍແລ້ວ " + (q.sold || 0) + "</div>" +
            '<button class="btn' + (out ? " off" : "") + '">' + (out ? "ໝົດແລ້ວ" : "ສັ່ງຊື້") + "</button>";
          if (!out) d.querySelector("button").onclick = function () { openM(q); };
          $("list").appendChild(d);
        });
      } catch (e) { msg.textContent = "ໂຫຼດຂໍ້ມູນບໍ່ໄດ້ ລອງໃໝ່ພາຍຫຼັງ"; }
    }
    boot();
  </script>
</body>
</html>

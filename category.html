<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ສິນຄ້າ - Blox Shop</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ===== ໜ້າຕ່າງຊຳລະເງິນ QR ===== */
    .pay-modal {
      position: fixed; inset: 0; z-index: 1000;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,.65); padding: 16px;
    }
    .pay-modal.on { display: flex; }
    .pay-box {
      position: relative; width: 100%; max-width: 380px;
      max-height: 92vh; overflow-y: auto;
      background: #0f1d3a; color: #fff;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 22px; padding: 18px; text-align: center;
    }
    .pay-box h4 { margin: 4px 0 14px; font-size: 22px; }
    .pay-x {
      position: absolute; top: 12px; right: 12px;
      width: 38px; height: 38px; border-radius: 50%;
      border: 0; background: rgba(255,255,255,.15);
      color: #fff; font-size: 20px; cursor: pointer;
    }
    .pay-name {
      background: rgba(255,255,255,.1); border-radius: 12px;
      padding: 12px; font-size: 17px; margin-bottom: 12px;
    }
    .pay-total b { color: #22c55e; font-size: 24px; }
    .pay-scan { margin: 10px 0; }
    .pay-qr {
      width: 100%; border-radius: 18px; display: block;
      background: #fff;
    }
    .pay-done { width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 6px 18px rgba(239,68,68,.45); transition: transform .12s, filter .12s; }
    .pay-done:hover { filter: brightness(1.08); }
    .pay-done:active { transform: scale(.98); }
    .pay-note { margin: 10px 0 0; font-size: 13px; opacity: .75; }
  </style>
</head>
<body>
  <div id="snow"></div>

  <div class="top">
    <div class="brand"><span id="bMain">BLOX</span> <b id="bAcc">SHOP</b></div>
    <a class="back" href="index.html">← ກັບໜ້າຫຼັກ</a>
  </div>

  <a class="fab" id="fab" href="#" target="_blank" aria-label="ແຊັດກັບຮ້ານ">
    <svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.7 1.4 5.1 3.6 6.7V22l3.3-1.8c.9.2 1.9.4 3.1.4 5.5 0 10-3.9 10-8.7S17.5 3 12 3z"/></svg>
  </a>

  <div class="wrap">
    <h3 class="sec" id="title" style="margin-top:6px"></h3>
    <p class="sec-sub" id="sub"></p>
    <div class="msg" id="msg">ກຳລັງໂຫຼດ...</div>
    <div id="list"></div>
  </div>

  <!-- ໜ້າຕ່າງຊຳລະເງິນ QR -->
  <div class="pay-modal" id="payModal">
    <div class="pay-box">
      <button class="pay-x" onclick="closePay()" aria-label="ປິດ">✕</button>
      <h4>ຊຳລະເງິນ</h4>
      <div class="pay-name" id="payName"></div>
      <div class="pay-total">ຍອດໂອນທັງໝົດ: <b id="payTotal"></b></div>
      <div class="pay-scan">ສະແກນເພື່ອໂອນ</div>
      <img class="pay-qr" id="payQR" alt="QR ຊຳລະເງິນ" />
      <button class="pay-done" onclick="paidDone()">ໂອນແລ້ວ -> ແຄັບສະລິບທັກແຊັດຮັບຂອງ</button>
      <p class="pay-note">* ກວດສອບຍອດເງິນໃຫ້ຖືກຕ້ອງກ່ອນໂອນ</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="site.js"></script>
  <script>
    const $ = function (id) { return document.getElementById(id); };
    let cur = null, catName = "", orderMsg = "";

    // ຮູບ QR ຮັບເງິນ (ວາງໄຟລ໌ໄວ້ໃນໂຟນເດີດຽວກັນ ຖ້າເປັນ .png ໃຫ້ປ່ຽນນາມສະກຸນ)
    const QR_IMG = "1795345334511.jpg";

    function closePay() { $("payModal").classList.remove("on"); }

    // ກົດ "ສັ່ງຊື້" -> ຂຶ້ນໜ້າຕ່າງ QR ທັນທີ
    function openM(p) {
      cur = p;
      orderMsg = "ສະບາຍດີ ຢາກສັ່ງຊື້:\n• " + catName + " - " + p.name + "\n• ລາຄາ: " + fmt(p.price) + "\n• ໂອນເງິນແລ້ວ (ແນບສະລິບ)";
      $("payName").textContent = p.name;
      $("payTotal").textContent = fmt(p.price);
      $("payQR").src = QR_IMG;
      $("payModal").classList.add("on");
    }

    // ກົດ "ໂອນແລ້ວ" -> ເປີດແຊັດ ໃຫ້ແຄັບສະລິບສົ່ງ
    function paidDone() {
      window.open(chatLink(orderMsg), "_blank");
      closePay();
    }

    async function boot() {
      setupCommon();
      const msg = $("msg");
      if (!db) { msg.textContent = "ຍັງບໍ່ໄດ້ຕັ້ງຄ່າ config.js"; return; }
      const id = new URLSearchParams(location.search).get("c");
      if (!id) { msg.textContent = "ບໍ່ພົບໝວດສິນຄ້າ"; return; }
      try {
        const c = await db.from("categories").select("*").eq("id", id).maybeSingle();
        const p = await db.from("products").select("*").eq("category_id", id).order("created_at");
        if (c.error || p.error || !c.data) { msg.textContent = "ໂຫຼດຂໍ້ມູນບໍ່ໄດ້"; return; }
        catName = c.data.name;
        $("title").textContent = c.data.name;
        $("sub").textContent = c.data.descr || "";
        document.title = c.data.name + " - Blox Shop";

        const items = p.data.filter(function (q) { return !q.hidden; });
        if (!items.length) { msg.textContent = "ຍັງບໍ່ມີສິນຄ້າໃນໝວດນີ້"; return; }
        msg.style.display = "none";

        items.forEach(function (q) {
          const out = !(q.stock > 0);
          const d = document.createElement("div");
          d.className = "cat";
          d.innerHTML =
            (q.img ? '<div class="ban"><img src="' + esc(q.img) + '" alt="' + esc(q.name) + '" /></div>' : "") +
            '<div class="ctitle">' + esc(q.name) +
              '<span class="tag">' + (q.type === "topup" ? "ເຕີມເກມ" : "ໄອດີ") + "</span></div>" +
            '<div class="ccount">' + esc(q.descr) + "</div>" +
            '<div class="price">' + fmt(q.price) + "</div>" +
            '<div class="ccount">ເຫຼືອ ' + (q.stock || 0) + " · ຂາຍແລ້ວ " + (q.sold || 0) + "</div>" +
            '<button class="btn' + (out ? " off" : "") + '">' + (out ? "ໝົດແລ້ວ" : "ສັ່ງຊື້") + "</button>";
          if (!out) d.querySelector("button").onclick = function () { openM(q); };
          $("list").appendChild(d);
        });
      } catch (e) { msg.textContent = "ໂຫຼດຂໍ້ມູນບໍ່ໄດ້ ລອງໃໝ່ພາຍຫຼັງ"; }
    }
    boot();
  </script>
</body>
</html>
